; PHP da imagem da API (api/Dockerfile). Uploads de GLB, PDFs e do vídeo das páginas (até 200 MB, os blocos 3D do SketchUp; config/livewire.php).
upload_max_filesize = 210M
post_max_size = 210M
memory_limit = 512M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
