version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      composer-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # Os tipos do Node acompanham o Node do projeto (24): major novo só junto com a troca do Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
