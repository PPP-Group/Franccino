version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      composer-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
